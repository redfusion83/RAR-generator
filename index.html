<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock am Ring · Lineup Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0d0b;
      --surface:   #12110e;
      --border:    #252320;
      --red:       #c8360a;
      --orange:    #e05a1a;
      --gold:      #c9910d;
      --white:     #f5f2ed;
      --dim:       #c0bab2;
      --muted:     #7a7570;
      --faint:     #3a3830;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Barlow Condensed', sans-serif;
    }

    /* ── PAGE CHROME ─────────────────────────────────── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem 5rem;
      gap: 0;
    }

    .site-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .site-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 7vw, 3.8rem);
      letter-spacing: 0.06em;
      color: var(--white);
      text-align: center;
      line-height: 1;
    }

    .site-title em { color: var(--red); font-style: normal; }

    .site-sub {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.45rem;
      margin-bottom: 2.2rem;
    }

    /* ── GENERATE BUTTON ─────────────────────────────── */
    .btn-wrap { margin-bottom: 2.8rem; }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.55rem;
      letter-spacing: 0.18em;
      color: var(--white);
      background: var(--red);
      border: none;
      cursor: pointer;
      padding: 0.7rem 3.2rem 0.6rem;
      clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
      transition: background 0.18s, transform 0.1s;
      position: relative;
      outline: none;
    }
    .btn:hover  { background: var(--orange); transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* ── POSTER ──────────────────────────────────────── */
    .poster {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0 0 2.5rem;
      text-align: center;
      position: relative;
    }

    /* Top flame bar */
    .poster::before {
      content: '';
      display: block;
      height: 5px;
      background: linear-gradient(90deg,
        var(--red) 0%, var(--orange) 30%, var(--gold) 50%, var(--orange) 70%, var(--red) 100%);
    }

    /* Corner marks */
    .poster::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid var(--faint);
      pointer-events: none;
    }

    /* ── POSTER HEADER ───────────────────────────────── */
    .poster-head {
      padding: 1.6rem 2rem 1.2rem;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .poster-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.2rem, 10vw, 5.8rem);
      letter-spacing: 0.04em;
      line-height: 0.88;
      color: var(--white);
    }
    .poster-logo span { color: var(--red); }

    .poster-meta {
      margin-top: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .poster-meta .dot { color: var(--red); font-size: 0.5rem; }

    /* ── LINEUP AREA ─────────────────────────────────── */
    .lineup-area {
      padding: 1.6rem 1.5rem 0.5rem;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      gap: 0;
    }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: var(--faint);
    }
    .empty-ring { font-size: 2.8rem; }
    .empty-text {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* ── TIER ROWS ───────────────────────────────────── */
    .tier { width: 100%; }
    .tier + .tier {
      border-top: 1px solid var(--border);
      margin-top: 0.4rem;
      padding-top: 0.4rem;
    }

    /* Tier 1 — headliner */
    .tier-1 .names {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.4rem, 12vw, 6.5rem);
      letter-spacing: 0.03em;
      line-height: 0.95;
      color: var(--white);
    }

    /* Tier 2 — co-headliners */
    .tier-2 .names {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.9rem, 6vw, 3.4rem);
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: var(--white);
    }
    .tier-2 .sep { color: var(--red); }

    /* Tier 3 — mid-tier */
    .tier-3 .names {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.3rem, 4vw, 2.1rem);
      letter-spacing: 0.04em;
      color: var(--dim);
    }
    .tier-3 .sep { color: var(--muted); }

    /* Tier 4 — support */
    .tier-4 .names {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(0.92rem, 2.6vw, 1.3rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #857f78;
    }
    .tier-4 .sep { color: var(--faint); }

    /* Tier 5 — small acts */
    .tier-5 .names {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(0.7rem, 1.9vw, 0.98rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tier-5 .sep { color: var(--faint); }

    /* ── FADE-IN ANIMATION ───────────────────────────── */
    .tier {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.38s ease, transform 0.38s ease;
    }
    .tier.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── POSTER FOOTER ───────────────────────────────── */
    .poster-foot {
      margin-top: 1.6rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--faint);
      position: relative;
      z-index: 1;
    }
    .poster-foot span { color: var(--red); }

    /* ── SPINNING ICON ON BUTTON ─────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .generating { animation: spin 0.6s linear infinite; display: inline-block; }
  </style>
</head>
<body>
<div class="page">

  <p class="site-label">Der offizielle</p>
  <h1 class="site-title">Rock am <em>Ring</em></h1>
  <p class="site-sub">Lineup Generator · Nürburgring · Eifel</p>

  <div class="btn-wrap">
    <button class="btn" id="genBtn" onclick="generate()">Generate!</button>
  </div>

  <div class="poster" id="poster">
    <div class="poster-head">
      <div class="poster-logo">ROCK AM <span>RING</span></div>
      <div class="poster-meta">
        <span>NÜRBURGRING</span>
        <span class="dot">●</span>
        <span>EIFEL</span>
        <span class="dot">●</span>
        <span>DEUTSCHLAND</span>
      </div>
    </div>

    <div class="lineup-area" id="lineupArea">
      <div class="empty" id="emptyState">
        <div class="empty-ring">🤘</div>
        <div class="empty-text">Klick auf Generate!</div>
      </div>
    </div>

    <div class="poster-foot" id="posterFoot" style="display:none">
      <span>★</span> &nbsp;GENERATED LINEUP · BASIEREND AUF 10 JAHREN ROCK AM RING &nbsp;<span>★</span>
    </div>
  </div>

</div>

<script>
  // ── DATA ──────────────────────────────────────────────────────────
  // Headliner pool: Rock am Ring 2015–2025
  const pool = {
    t1: [
      // Top headliners — always closed the main stage
      'Foo Fighters',
      'Rammstein',
      'Green Day',
      'Die Toten Hosen',
      'Red Hot Chili Peppers',
      'Muse',
      'System Of A Down',
      'Slipknot',
      'Die Ärzte',
      'KoRn',
      'Tool',
      'The Prodigy',
      'Bring Me The Horizon',
      'Metallica',
      'Iron Maiden',
    ],
    t2: [
      // Co-headliners / strong second acts
      'Volbeat',
      '30 Seconds To Mars',
      'Gorillaz',
      'Marilyn Manson',
      'Macklemore & Ryan Lewis',
      'Kings Of Leon',
      'Incubus',
      'Queens Of The Stone Age',
      'In Flames',
      'Maneskin',
      'Sleep Token',
      'Rise Against',
      'Beatsteaks',
      'Slash',
      'A Day To Remember',
      'Biffy Clyro',
      'Disturbed',
      'Billy Talent',
      'Marteria & Casper',
    ],
    t3: [
      // Mid-card
      'Bullet For My Valentine',
      'Powerwolf',
      'Heaven Shall Burn',
      'Electric Callboy',
      'Turbostaat',
      'Frank Turner & The Sleeping Souls',
      'Jinjer',
      'Northlane',
      'Architects',
      'Bad Omens',
      'Babymetal',
      'Trivium',
      'Airbourne',
      'Feine Sahne Fischfilet',
      'The Hives',
      'Skillet',
      'Zebrahead',
      'Millencolin',
      'IDLES',
      'Deafheaven',
      'The Ghost Inside',
      'Nothing More',
      'Lorna Shore',
      'Falling In Reverse',
      'Mastodon',
      'Don Broco',
      'Jerry Cantrell',
      'Kittie',
    ],
    t4: [
      // Support
      'Massendefekt',
      'Adam Angst',
      'Boston Manor',
      'Creeper',
      'Destroy Boys',
      'Fjort',
      'Drug Church',
      'DIE NERVEN',
      'ZSK',
      'Grade 2',
      'Imminence',
      'K.I.Z',
      'SDP',
      'Drain',
      'Loathe',
      'Magnolia Park',
      'Malevolence',
      'Danko Jones',
      'Papa Roach',
      'Sabaton',
      'Within Temptation',
      'Bush',
      'The Offspring',
      'Limp Bizkit',
      'Anti-Flag',
      'Terror',
    ],
    t5: [
      // Small / local acts
      'Drangsal',
      'Amira Elfeky',
      'AViVA',
      'Brutalismus 3000',
      'Christin Nichols',
      'Fleshwater',
      'FROG LEAP',
      'Holy Wars',
      'I See Stars',
      'Leftovers',
      'LØLØ',
      'Mia Morgan',
      'Future Palace',
      'Nasty',
      'Kontra K',
      'Tocotronic',
      'Defects',
      'Weezer',
      'Ankor',
      'Slay Squad',
      'Dead Poet Society',
      'House Of Protection',
      'I Prevail',
    ],
  };

  // ── HELPERS ───────────────────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pick(arr, n, exclude = []) {
    return shuffle(arr.filter(x => !exclude.includes(x))).slice(0, n);
  }

  // ── RENDER ────────────────────────────────────────────────────────
  function makeTier(cls, names, sep) {
    const sepHtml = `<span class="sep"> ${sep} </span>`;
    const inner = names.map(n => `<span>${n}</span>`).join(sepHtml);
    return `<div class="tier ${cls}"><div class="names">${inner}</div></div>`;
  }

  function generate() {
    const btn = document.getElementById('genBtn');
    const area = document.getElementById('lineupArea');
    const foot = document.getElementById('posterFoot');

    // Button feedback
    btn.disabled = true;
    btn.innerHTML = '<span class="generating">⟳</span>';

    // Reset
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    foot.style.display = 'none';

    // Clear old tiers
    area.querySelectorAll('.tier').forEach(el => el.remove());

    setTimeout(() => {
      const h1 = pick(pool.t1, 1);
      const h2 = pick(pool.t2, 2, h1);
      const h3 = pick(pool.t3, 4, [...h1, ...h2]);
      const h4 = pick(pool.t4, 6, [...h1, ...h2, ...h3]);
      const h5 = pick(pool.t5, 8, [...h1, ...h2, ...h3, ...h4]);

      const tiers = [
        makeTier('tier tier-1', h1, ''),
        makeTier('tier tier-2', h2, '·'),
        makeTier('tier tier-3', h3, '·'),
        makeTier('tier tier-4', h4, '·'),
        makeTier('tier tier-5', h5, '·'),
      ];

      tiers.forEach(html => {
        area.insertAdjacentHTML('beforeend', html);
      });

      // Stagger reveal — each tier 80ms after the last
      const tierEls = area.querySelectorAll('.tier');
      tierEls.forEach((el, i) => {
        setTimeout(() => el.classList.add('show'), i * 90);
      });

      // Show footer after all tiers
      setTimeout(() => {
        foot.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Generate!';
      }, tierEls.length * 90 + 300);
    }, 180);
  }
</script>
</body>
</html>
